<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mendeley</title>
    <link rel="stylesheet" href="vendor/v1/plugins.css">
    <link rel="stylesheet" href="dist/styles.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; color: #333; margin: 0; padding: 0; }
        .btn-action { width: 100%; box-sizing: border-box; padding: 10px; border-radius: 6px; font-weight: 600; cursor: pointer; border: none; margin-bottom: 12px; font-size: 13px; }
        .btn-primary { background-color: #d32f2f; color: white; }
        .btn-secondary { background-color: #f1f3f4; color: #333; border: 1px solid #dadce0; }
        .hidden { display: none !important; }
    </style>
</head>
<body spellcheck="false" class="noselect">
    <div id="errorWrapper" class="errorMsg hidden"></div>

    <div id="content">
        <div id="mainCont" class="flexCol">
            
            <!-- 1. LOGIN STATE -->
            <div id="loginState" style="padding: 16px;">
                <p style="font-weight: 700; font-size: 16px; margin: 0 0 6px 0; color: #b71c1c;">Mendeley Reference Manager</p>
                <p style="font-size: 12px; color: #666; margin: 0 0 16px 0; line-height: 1.4;">Sign in to search and insert citations directly from your Mendeley cloud library.</p>
                
                <!-- Direct Inline Trigger Button -->
                <button id="getBrowserTokenBtn" class="btn-action btn-primary" onclick="window.onSignInClick()">
                    Sign In with Mendeley Account
                </button>
                
                <!-- Demo Mode Button -->
                <button id="demoModeBtn" class="btn-action btn-secondary" onclick="window.onDemoModeClick()">
                    Try Offline Demo Mode
                </button>
                
                <!-- Manual Token Field -->
                <div style="margin-top: 14px; border-top: 1px solid #eee; padding-top: 14px;">
                    <span style="font-size: 12px; font-weight: 600; color: #555; display: block; margin-bottom: 6px;">Access Token / Bearer Token:</span>
                    <input id="tokenField" type="password" placeholder="Paste Mendeley Token here" 
                        style="width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; margin-bottom: 8px;" />
                    <button id="connectTokenBtn" class="btn-action btn-secondary" onclick="window.onConnectTokenClick()" style="margin-bottom: 0;">
                        Connect with Token
                    </button>
                </div>
                
                <div id="loginMessage" style="margin-top: 10px; font-size: 12px;"></div>
            </div>

            <!-- 2. MAIN STATE (REFERENCE LIST) -->
            <div id="mainState" class="flexCol flexSize hidden">
                <div class="top-bar-container">
                    <select id="libraryGroupSelect" class="library-selector">
                        <option value="all">All References</option>
                    </select>
                    <div class="more-btn-wrapper">
                        <button id="moreMenuBtn" class="more-btn">More ▾</button>
                        <div id="moreDropdown" class="more-dropdown hidden">
                            <div class="dropdown-item" id="menuInsertBib">Insert bibliography</div>
                            <div class="dropdown-item" id="menuRefresh">Refresh reference</div>
                            <div class="dropdown-item" id="menuSettings">Citation style settings</div>
                            <div class="dropdown-item" id="menuUnlink">Unlink citations</div>
                            <div class="dropdown-item" id="logoutLink" style="color: #d32f2f;">Logout</div>
                        </div>
                    </div>
                </div>

                <div style="padding: 10px 12px 6px;">
                    <input id="searchField" autocomplete="off" type="text"
                        style="width: 100%; box-sizing: border-box; padding: 8px 12px; border-radius: 6px; border: 1px solid #ccc; font-size: 13px;"
                        placeholder="Search reference by title, author, year..." />
                </div>

                <div id="docsWrapper" class="flexSize" style="padding: 6px 12px; overflow-y: auto;">
                    <div class="flexCol flexSize">
                        <div id="nothingFound" class="flexCol hidden" style="text-align: center; color: #888; margin-top: 30px;">No references found</div>
                        <div id="docsHolder" class="flexCol"></div>
                        <div id="libLoader" class="hidden" style="text-align: center; padding: 12px; color: #666;">Loading references...</div>
                    </div>
                </div>

                <div class="bottom-dock">
                    <div id="selectedWrapper" class="hidden" style="margin-bottom: 6px;">
                        <div id="selectedHolder" style="display: flex; flex-wrap: wrap;"></div>
                    </div>
                    <div class="dock-actions">
                        <button id="insertLinkBtn" class="primary" disabled style="background-color: #d32f2f; color: white; border: none; border-radius: 6px; cursor: pointer; padding: 8px 16px;">Insert citation</button>
                        <button id="cancelSelectBtn" style="background: white; border: 1px solid #ccc; border-radius: 6px; cursor: pointer; padding: 8px 16px;">Cancel</button>
                    </div>
                </div>
            </div>

            <!-- 3. SETTINGS STATE -->
            <div id="settingsState" class="hidden flexCol flexSize" style="padding: 16px;">
                <p style="font-weight: 600; margin-bottom: 12px;">Citation Style Settings</p>
                <div id="styleWrapper">
                    <label for="styleSelect">Style</label>
                    <div class="style-select-combination">
                        <div id="styleSelectedListOther"></div>
                        <div id="styleSelectList"></div>
                    </div>
                    <div id="styleMessage"></div>
                    <label style="margin-top: 12px; display: block;">Language</label>
                    <div id="styleLangList"></div>
                    <div id="langMessage"></div>
                </div>
                <button id="settingsBackBtn" style="margin-top: 20px; width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc; cursor: pointer;">Back to References</button>
            </div>

        </div>
    </div>

    <!-- Scripts -->
    <script src="vendor/v1/plugins.js"></script>
    <script src="vendor/v1/plugins-ui.js"></script>
    <script src="vendor/citeproc/citeproc_commonjs.js"></script>
    <script src="dist/bundle.modern.js"></script>
</body>
</html>
