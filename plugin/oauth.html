<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mendeley Login Helper</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            margin: 0;
            padding: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            max-width: 480px;
            width: 100%;
            padding: 28px;
        }
        h2 {
            margin-top: 0;
            color: #b71c1c;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
        }
        p {
            font-size: 14px;
            line-height: 1.5;
            color: #555;
        }
        .token-box {
            background: #f1f3f4;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 12px;
            word-break: break-all;
            font-family: monospace;
            font-size: 13px;
            margin: 16px 0;
            user-select: all;
        }
        button {
            background-color: #d32f2f;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background-color: #b71c1c;
        }
        .success-banner {
            background-color: #e8f5e9;
            color: #2e7d32;
            padding: 12px;
            border-radius: 6px;
            font-weight: 500;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Mendeley Authorization</h2>
        <div id="statusContainer">
            <p>Processing authorization...</p>
        </div>
    </div>

    <script>
        (function () {
            const statusDiv = document.getElementById("statusContainer");
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            const token = params.get("access_token");

            if (token) {
                // Try to pass token to opener if available
                if (window.opener && typeof window.opener.OAuthCallback === "function") {
                    try {
                        window.opener.OAuthCallback(token, params.get("state") || "");
                    } catch (e) {}
                }

                statusDiv.innerHTML = `
                    <div class="success-banner">✓ Authentication Successful!</div>
                    <p>Copy your Access Token below and paste it into the ONLYOFFICE Mendeley plugin sidebar:</p>
                    <div class="token-box" id="tokenDisplay">${token}</div>
                    <button id="copyBtn">Copy Token & Return to OnlyOffice</button>
                `;

                document.getElementById("copyBtn").addEventListener("click", () => {
                    navigator.clipboard.writeText(token).then(() => {
                        const btn = document.getElementById("copyBtn");
                        btn.innerText = "Copied! Paste into OnlyOffice";
                        btn.style.backgroundColor = "#2e7d32";
                    });
                });
            } else {
                const searchParams = new URLSearchParams(window.location.search);
                const error = searchParams.get("error_description") || searchParams.get("error") || "No access token found.";
                statusDiv.innerHTML = `
                    <p style="color: #c62828; font-weight: 500;">Authentication Error:</p>
                    <div class="token-box">${error}</div>
                    <p>Please ensure your Mendeley App ID and Redirect URI are properly configured.</p>
                `;
            }
        })();
    </script>
</body>
</html>
